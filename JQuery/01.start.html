<!DOCTYPE html>
<html>
<head>
    <title>jQuery 예제</title>
    <!-- jQuery 라이브러리 로드 -->

    <!-- jQuery CDN 방식으로 포함하기 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- jQuery 라이브러리 파일로 포함하기 -->
    <script src="js/jquery-3.7.1.min.js"></script>

    <script>
        // JavaScript 문서 준비 이벤트
        document.addEventListener("DOMContentLoaded", () => {})

        // jQuery 문서 준비 이벤트
        $(document).ready(function() {
            alert("Hello jQuery!")
        })

        // jQuery 문서 준비 이벤트 축약형
        $(function() {
            alert("Hello jQuery!")
            $('h1').text("Bye jQuery!")
            // document.getElementsByTagName('h1')[0].textContent = "Bye jQuery!"
        })

        // document.querySelectorAll = $(.선택자)
        // html 셀렉터로 찾으면 html 함수가 뒤에 와야하고
        // jQuery 셀렉터로 찾으면 jQuery 함수를 뒤에 붙여야 함
        // ex) $('.선택자').innerhtml → 틀린 문법

    </script>
</head>
<body>
    <!-- 페이지 내용 -->
     <h1>Hello jQuery!</h1>
</body>
</html>
