<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOHA UI</title>
    <link rel="stylesheet" href="css/ALOHA UI.css">
</head>
<body>
    <header class="nav">
        <div class="logo">ALOHA UI</div>
        <nav class="main-menu">
            <a href="#">Home</a>
            <a href="#">Features</a>
            <a href="#">Tabs</a>
            <a href="#">Contact</a>
        </nav>
        <div class="util">
            <a href="#">로그인</a>
            <a href="#">회원가입</a>
            <button class="menu-button">Menu</button>
        </div>
    </header>

    <main class="container">
        <section class="hero-section">
            <div class="hero-text">
                <h1>세련된 UI 컴포넌트</h1>
                <p>오프캔버스, 탭, 플로팅 버튼 등 UI 요소를 조합한 예시입니다. 깔끔한 레이아웃과 감각적인 컬러로 빠르게 시작하세요.</p>
                <div class="hero-actions">
                    <button class="btn btn-primary">지금 살펴보기</button>
                    <button class="btn btn-secondary">탭 보기</button>
                </div>
            </div>
            <div class="hero-image-placeholder">
                </div>
        </section>
        
        <section class="component-showcase">
            <div class="card">
                <p class="icon"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#black"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm540-453h100v-107H700v107Zm0 186h100v-106H700v106ZM160-240h460v-480H160v480Zm540 0h100v-107H700v107Z"/></svg></p>
                <h3>오프캔버스</h3>
                <p>체크박스 기반으로 부드럽게 열리고 닫히는 네비게이션</p>
            </div>
            <div class="card">
                <p class="icon"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#black"><path d="M560-320h80v-80h80v-80h-80v-80h-80v80h-80v80h80v80ZM160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v400q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H447l-80-80H160v480Zm0 0v-480 480Z"/></svg></p>
                <h3>탭</h3>
                <p>라디오 버튼을 이용한 순수 CSS 탭 전환.</p>
            </div>
            <div class="card">
                <p class="icon">+</p>
                <h3>플로팅 버튼</h3>
                <p>핵심 액션에 빠르게 접근하는 동작 또는 버튼</p>
            </div>
        </section>

        <section class="tab-section">
            <div class="tab-controls">
                <input type="radio" id="tab1" name="tab-group" checked>
                <label for="tab1" class="tab-label tab1-style">탭 1</label>

                <input type="radio" id="tab2" name="tab-group">
                <label for="tab2" class="tab-label">탭 2</label>

                <input type="radio" id="tab3" name="tab-group">
                <label for="tab3" class="tab-label">탭 3</label>
            </div>

            <div class="tab-content-container">
                <div class="tab-content-wrapper">
                    <div class="tab-content content-1">
                        <img src="img/1.jpg" alt="">
                    </div>
                    <div class="tab-content content-2">
                        <img src="img/2.jpg" alt="">
                    </div>
                    <div class="tab-content content-3">
                        <img src="img/3.jpg" alt="">
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
