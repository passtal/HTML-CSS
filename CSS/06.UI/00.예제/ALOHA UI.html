<!-- header 에
    logo - aloha ui // nav id 에  Home Features Tabs Contact
    container - 오토캔버스 / 탭 / 플로팅 버튼
    util 에 로그인 회원가입
    1200px (전체화면크기)

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALOHA UI</title>
    <link rel="stylesheet" href="css/ALOHA UI.css">
</head>
<body>
    <header>
        <div class="inner">
            <div class="logo">
                <a href=""><img src="img/hero.svg" alt="logo"></a>
                <a href="">ALOHA UI</a>
            </div>
          <nav id="nav">
              <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Features</a></li>
                <li><a href="">Tabs</a></li>
                <li><a href="">Contact</a></li>
              </ul>
          </nav>
          <div class="util">
              <a href="" class="btn border">로그인</a>
              <a href="" class="btn primary">회원가입</a>
          </div>
        </div>
    </header>
    <div class="main">
        <section>
            <h1>세련된 UI 컴포넌트</h1>
            <p>오프캔버스, 탭, 플로팅 버튼 등 UI 요소들을 조합한 메인 예시입니다. 깔끔한 레이아웃과 감각적인 컬러로 빠르게 시작하세요.</p>
            <a href="" class="btn-menu">지금 살펴보기</a>
            <a href="" class="btn-menu2">탭 보기</a>
        </section>
    </div>
    <div class="container">
        <button class="btn offcanvas">오프캔버스</button>
            <p>체크박스 기반으로 부드럽게 열리고 닫히는 네비게이션</p>
        <button class="btn tab">탭</button>
            <p>라디오 버튼을 이용한 순수 CSS 탭 전환</p>
        <button class="btn floating">플로팅 버튼</button>
            <p>핵심 액션에 빠르게 접근하는 둥둥 뜨는 버튼</p>
    </div>
    <div class="container">
        <div class="tab-box">
            <input type="radio" name="tab" id="tab1">
            <label for="tab1" class="tab-item">Tab 1</label>

            <input type="radio" name="tab" id="tab2">
            <label for="tab2" class="tab-item">Tab 2</label>

            <input type="radio" name="tab" id="tab3">
            <label for="tab3" class="tab-item">Tab 3</label>

            <div class="tab-content" id="content1">
                <img src="img/1.jpg" alt="이미지1" width="500">
            </div>
            <div class="tab-content" id="content2">
                <img src="img/2.jpg" alt="이미지2" width="500">
            </div>
            <div class="tab-content" id="content3">
                <img src="img/3.jpg" alt="이미지3" width="500">
            </div>
        </div>
    </div>
</body>
</html>
