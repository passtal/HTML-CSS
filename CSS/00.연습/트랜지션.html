<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전환 속성 예시</title>
    <style>
        body {
            margin: 50px;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
        }

        .transition-example {
            width: 150px;
            height: 50px;
            background-color: lightcoral;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .transition-example:hover {
            background-color: violet;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <button class="transition-example">눌러주세요</button>
</body>
</html>
