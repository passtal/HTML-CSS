<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엄격모드</title>
    <script>
        'use strict'
        // (일반모드) : 에러같지만 허용해준다.
        // (엄격모드) : 유연하게 허용되는 문법들을 엄격하게 검사하여 에러 발생

        // 변수 선언 시. 키워드를 지정하지 않은 경우 (var / let)
        data = 10
        // ㄴ 에러발생 .. data is not defined .. (변수를 지정하지 않고 곧바로 초기화했기 때문)
    </script>
</head>
<body>
    
</body>
</html>
