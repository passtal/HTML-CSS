<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>object</title>
</head>
<body>
    <script>
        // 객체 정의 및 생성 (리터럴 방식)
        /* 
            {
              속성 1 : 값1
              속성 2 : 값
              메소드명 : function() {
              }
            }
         */

        let name = '김조은'
        let age = 20
        let person = {
            // 속성 - property
            name    : '이조은',
            age     : 20,
            // 메소드
            print   : function() {
                return this.name + ' : ' + this.age
            }
            // this : 객체 자기 자신을 가리키는 키워드
        }
        // 속성 추가
        person.major = '컴퓨터 공학'

        // . : 객체 접근 연산자
        document.write( person.name + ', ' )
        document.write( person.age + ', ' )
        document.write( person.major + ', ' )
        document.write( '<br>' )
        document.write( person.print() )

    </script>
</body>
</html>
