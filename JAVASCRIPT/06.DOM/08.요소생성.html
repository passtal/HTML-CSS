<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소 생성</title>
    <style>
        .container {
            width: 100%;
            min-width: 800px;
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            box-sizing: border-box;
            border-radius: 5px;
        }
        .input-box {
            margin-bottom: 10px;
            padding: 20px;
            
        }
        button { 
            width: calc(100% -40px);
            height: 40px;
            font-size: 20px;
            text-align: center;
            display: block;
            margin: 0 auto;
         }
         .card {
            width: 170px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            margin: 10px;
            display: inline-block;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            position: relative;
         }
         .card img {
            width: 100%;
            border-radius: 8px;
         }
         .price {
            font-weight: bold;
            margin-top: 10px;
         }
         .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
         }
    </style>
</head>
<body>
    <h2>상품 카드 생성</h2>
    <div class="container">
        <div class="input-box">
            <input type="text" id="productName" placeholder="상품명 입력">
        </div>
        <div class="input-box">
            <input type="text" id="productImg" placeholder="이미지 URL 입력">
        </div>
        <div class="input-box">
            <input type="text" id="productPrice" placeholder="가격 입력">
        </div>
        <div>
            <button id="add">상품 추가</button>
        </div>
        <div id="productList"></div>
    </div>
    <script>
    // 상품 추가 버튼 클릭 이벤트
    const $addBtn = document.getElementById('add')

    $addBtn.addEventListener("click", () => {
        const name = document.getElementById("productName").value
        const img = document.getElementById("productImg").value
        const price = document.getElementById("productPrice").value

        if (!name || !img || !price) {
            alert("상품명, 이미지URL, 가격을 모두 입력해주세요")
            return
        }
        
        // 상품 리스트 컨테이너
        const $productList = document.getElementById("productList")

        // 1. 카드 요소 생성
        const card = document.createElement("div")
        card.className = "card"
        
        // 2. 이미지 요소 생성 및 속성 설정
        const imgTag = document.createElement("img")
        imgTag.src = img

        // 3. 상품명(제목) 요소 생성 및 내용 설정
        const titleTag = document.createElement("h3") // ✨ 상품명 변수명을 titleTag로 명확히 사용
        titleTag.textContent = name

        // 4. 가격 요소 생성 및 내용 설정
        const priceTag = document.createElement("p")
        priceTag.className = "price"
        priceTag.textContent = price + "원"

        // 5. 삭제 버튼 요소 생성 및 기능 추가
        const deleteBtn = document.createElement("button")
        deleteBtn.className = "delete-btn"
        deleteBtn.textContent = "삭제"
        
        // 버튼 클릭 시 부모 요소(card)를 삭제하는 이벤트 리스너 추가
        deleteBtn.addEventListener('click', function() {
            card.remove()
        })

        // 6. 생성한 모든 요소를 카드에 추가
        card.appendChild(imgTag)
        card.appendChild(titleTag)   // ✨ 누락된 상품명 요소를 추가합니다. (titleTag 사용)
        card.appendChild(priceTag)
        card.appendChild(deleteBtn)

        // 7. 상품 목록에 카드 추가
        $productList.appendChild(card)

        // 8. 입력 초기화
        document.getElementById("productName").value = ""
        document.getElementById("productImg").value = ""
        document.getElementById("productPrice").value = ""
    })
    </script>
</body>
</html>
