<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>var배열</title>
    <script>
        
        var pen = new Array(4)
        pen[0] = 'red'
        pen[1] = 'green'
        pen[2] = 'blue'
        pen[3] = 'orange'

        console.log(pen)
        console.log(pen[2])

        // 배열은 기본형 이외에 단축형도 많이 사용
        // 단축형1
        var room = new Array()
        room = ['red', 'green', 'blue', 'orange']
        console.log(room)

        // 단축형2
        var str = new Array('red', 'green', 'blue', 'orange')
        console.log(str)

        // 배열은 변수와 같이 각각의 소스들을 스스로 변경 가능
        // str 배열의 세 번째 소스를 pink로 변경 후 출력

        // 배열 설정
        var str = new Array('red', 'green', 'blue', 'orange')
        console.log(str)

        // 배열 변경
        str[2] = 'pink'
        console.log(str)

        // 중요 매소드 정리
        var str = new Array('red', 'green', 'blue', 'orange')
        console.log(str)
        var num = new Array('pen', 5, false, '설악산')
        console.log(num)                    // 배열 출력
        console.log(num.length)             // 배열의 갯수 출력

        // concat() → 하나의 배열에 다른 배열의 요소를 결합시킴
        var all = str.concat(num)       // 배열 str에 num 합치기
        console.log(all)

    </script>
</head>
<body>
    
</body>
</html>
