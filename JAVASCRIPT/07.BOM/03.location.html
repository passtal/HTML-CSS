<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>location</title>
    <script>
        // location
        // 현재 페이지에 대한 위치 정보를 가진 객체
        document.write(`<h3>현재 주소 : ${location.href}</h3>`)
        document.write(`<h3>호스트 이름 : ${location.hostname}</h3>`)
        document.write(`<h3>포트 : ${location.port}</h3>`)
        document.write(`<h3>경로 : ${location.pathname}</h3>`)
        document.write(`<h3>프로토콜 : ${location.protocol}</h3>`)
        document.write(`<h3>쿼리스트링 : ${location.search}</h3>`)

        // 문서 준비 이벤트
        document.addEventListener("DOMContentLoaded", () => {
            // 버튼 요소 선택
            let $move = document.getElementById("move")
            let $refresh = document.getElementById("refresh")

            // 페이지 이동 버튼 클릭
            $move.addEventListener("click", () => {
                location.href = 'http://www.naver.com'  // 이동
                // location.href = './index.html'       // 이동
                // location.assign('./index.html')      // 이동
                // window.open('./index.html', '_blank')     // 새창열기
                // location.replace('./index.html')     // 변경(뒤로가기 불가)
            })

            // 새로고침 버튼 클릭 이벤트
            $refresh.addEventListener("click", () => {
                location.reload()       // 새로 고침
            })
        })
    </script>
</head>
<body>
    <div class="container">
        <div class="btn-box">
            <button id="move">페이지 이동</button>
            <button id="refresh">새로 고침</button>
        </div>
    </div>
</body>
</html>
