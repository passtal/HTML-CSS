<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>history</title>
    <script>
        function main() {
            history.main()
        }
        function back() {
            history.back()
        }
        function forward() {
            history.forward()
        }
        document,addEventListener("DOMContentLoaded", () => {
            let $go = document.getElementById("go")
            $go.addEventListener("click", () => {
                let number = document.getElementById(`number`).value
                history.go(number)
                // go(숫자)
                // * -2 : 뒤로 2페이지 이동
                // * +2 : 앞으로 2페이지 이동
            })
        })
    </script>
</head>
<body>
    <div class="btn-box">
        <button id="main" onclick="main()">메인</button>
        <br>
        <button id="back" onclick="back()">뒤로 가기</button>
        <a href="javascript: history.back();">뒤로 가기</a>
        <br>
        <button id="forward" onclick="forward()">앞으로 가기</button>
        <a href="javascript: history.forward();">앞으로 가기</a>
        <br>
        <a href="javascript:;">페이지 이동 막기</a>
        <hr>
        <input type="number" id="number">
        <button id="go">기록 이동하기</button>
    </div>
</body>
</html>
